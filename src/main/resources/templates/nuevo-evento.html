<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Evento</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="form-container">
    <h2>Nuevo Evento</h2>

    <form th:action="@{/eventos/guardar}" th:object="${evento}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label>Nombre del evento</label>
            <input type="text" th:field="*{nombre}" placeholder="Ej: Festival de Música" />
            <span class="error-msg" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
        </div>

        <div class="form-group">
            <label>Descripción</label>
            <textarea th:field="*{descripcion}" placeholder="Breve descripción del evento"></textarea>
            <span class="error-msg" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span>
        </div>

        <div class="form-group">
            <label>Fecha</label>
            <input type="text" th:field="*{fecha}" placeholder="Ej: 2026-11-10" />
            <span class="error-msg" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></span>
        </div>

        <div class="form-group">
            <label>Lugar</label>
            <input type="text" th:field="*{lugar}" placeholder="Ej: Auditorio Principal" />
            <span class="error-msg" th:if="${#fields.hasErrors('lugar')}" th:errors="*{lugar}"></span>
        </div>

        <div class="form-group">
            <label>Categoría</label>
            <select th:field="*{categoria}">
                <option value="">-- Selecciona una categoría --</option>
                <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
            </select>
        </div>

        <div class="btn-container">
            <button type="submit" class="btn-submit">Guardar evento</button>
            <a th:href="@{/eventos}" class="btn-cancel">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
