<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestor de Eventos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; padding: 40px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .header h1 { font-size: 22px; font-weight: 500; color: #1a1a1a; }
        .header p { font-size: 13px; color: #888; margin-top: 2px; }
        .btn-nuevo { background: #2c3e50; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
        .card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 12px; padding: 3px 10px; border-radius: 6px; background: #eff6ff; color: #2563eb; }
        .nombre { font-size: 16px; font-weight: 500; color: #1a1a1a; }
        .descripcion { font-size: 13px; color: #666; }
        .card-footer { border-top: 1px solid #f0f0f0; padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
        .card-footer span { font-size: 13px; color: #666; }
        .card-actions { display: flex; gap: 8px; margin-top: 8px; }
        .btn-editar { background: #f0f4f8; color: #2c3e50; padding: 6px 14px; border-radius: 6px; text-decoration: none; font-size: 12px; border: 1px solid #d1d5db; }
        .btn-eliminar { background: #fef2f2; color: #dc2626; padding: 6px 14px; border-radius: 6px; text-decoration: none; font-size: 12px; border: 1px solid #fecaca; }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h1>Gestor de Eventos</h1>
        <p>Próximos eventos 2026</p>
    </div>
    <a href="/eventos/nuevo" class="btn-nuevo">+ Nuevo evento</a>
</div>

<div class="grid">
    <div class="card" th:each="evento : ${eventos}">
        <div class="card-top">
            <span class="badge">Evento</span>
        </div>
        <p class="nombre" th:text="${evento.nombre}"></p>
        <p class="descripcion" th:text="${evento.descripcion}"></p>
        <div class="card-footer">
            <span>📅 <span th:text="${evento.fecha}"></span></span>
            <span>📍 <span th:text="${evento.lugar}"></span></span>
        </div>
        <div class="card-actions">
            <a th:href="@{/eventos/editar/{id}(id=${evento.id})}" class="btn-editar">Editar</a>
            <a th:href="@{/eventos/eliminar/{id}(id=${evento.id})}" class="btn-eliminar">Eliminar</a>
        </div>
    </div>
</div>

</body>
</html>
