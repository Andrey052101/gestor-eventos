<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestor de Eventos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f8; }
        h1 { color: #2c3e50; }
        table { border-collapse: collapse; width: 100%; background: white; }
        th { background-color: #2c3e50; color: white; padding: 12px 16px; text-align: left; }
        td { padding: 10px 16px; border-bottom: 1px solid #ddd; }
        tr:hover { background-color: #f0f4f8; }
    </style>
</head>
<body>
<h1>Lista de Eventos</h1>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Fecha</th>
        <th>Lugar</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="evento : ${eventos}">
        <td th:text="${evento.id}"></td>
        <td th:text="${evento.nombre}"></td>
        <td th:text="${evento.descripcion}"></td>
        <td th:text="${evento.fecha}"></td>
        <td th:text="${evento.lugar}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
