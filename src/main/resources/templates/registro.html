<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta – Gestor de Eventos</title>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <style>
        body {
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
        }
        .btn-primary {
            background: #16a34a;
            border-color: #16a34a;
        }
        .btn-primary:hover {
            background: #15803d;
            border-color: #15803d;
        }
        .brand { color: #1a202c; font-weight: 800; }
        .form-label .oblig { color: #dc2626; }
        .form-text { color: #64748b; }
    </style>
</head>
<body>

<div class="card p-5" style="width: 100%; max-width: 440px;">

    <h2 class="brand mb-1">Gestor de Eventos</h2>
    <h5 class="text-muted mb-4">Crear Cuenta</h5>

    <!-- Mensajes -->
    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

    <form th:action="@{/registro}" method="post">

        <div class="mb-3">
            <label for="nombre" class="form-label fw-semibold">
                Nombre de usuario <span class="oblig">*</span>
            </label>
            <input type="text" id="nombre" name="nombre"
                   class="form-control form-control-lg"
                   placeholder="Ej: andrey123" autofocus required/>
        </div>

        <div class="mb-3">
            <label for="correo" class="form-label fw-semibold">
                Correo electrónico <span class="oblig">*</span>
            </label>
            <input type="email" id="correo" name="correo"
                   class="form-control form-control-lg"
                   placeholder="Ej: andrey@email.com" required/>
        </div>

        <div class="mb-4">
            <label for="contrasena" class="form-label fw-semibold">
                Contraseña <span class="oblig">*</span>
            </label>
            <input type="password" id="contrasena" name="contrasena"
                   class="form-control form-control-lg"
                   placeholder="Mínimo 6 caracteres" minlength="6" required/>
            <div class="form-text">Mínimo 6 caracteres</div>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg">Registrarme</button>
            <a href="/login" class="btn btn-outline-secondary btn-lg">Ya tengo cuenta</a>
        </div>

    </form>
</div>

</body>
</html>
