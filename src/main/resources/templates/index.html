<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Eventos</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <style>
        body.oscuro {
            background-color: #0f172a !important;
            color: #e2e8f0 !important;
        }
        body.oscuro .barra-usuario {
            background-color: #1e293b !important;
            border-color: #334155 !important;
            color: #e2e8f0 !important;
        }
        body.oscuro .header-container { border-bottom-color: #334155; }
        body.oscuro .header-title h1 { color: #f1f5f9 !important; }
        body.oscuro .header-title p { color: #94a3b8 !important; }
        body.oscuro .toolbar {
            background: #1e293b !important;
            border-color: #334155 !important;
        }
        body.oscuro .cat-btn {
            background-color: #334155 !important;
            color: #cbd5e0 !important;
            border-color: #475569 !important;
        }
        body.oscuro .cat-btn.active {
            background-color: #e2e8f0 !important;
            color: #0f172a !important;
        }
        body.oscuro .search-container input {
            background: #334155 !important;
            color: #e2e8f0 !important;
            border-color: #475569 !important;
        }
        body.oscuro .card {
            background: #1e293b !important;
            border-color: #334155 !important;
            color: #e2e8f0 !important;
        }
        body.oscuro .card h3 { color: #f1f5f9 !important; }
        body.oscuro .card p { color: #94a3b8 !important; }
        body.oscuro .card-badge {
            background: #334155 !important;
            color: #cbd5e0 !important;
        }
        body.oscuro .card-footer { border-top-color: #334155 !important; }
        body.oscuro .btn-editar {
            background: #334155 !important;
            color: #e2e8f0 !important;
            border-color: #475569 !important;
        }
        body.oscuro .pagination-container {
            background: #1e293b !important;
            border-color: #334155 !important;
            color: #e2e8f0 !important;
        }
        body.oscuro .pagination-buttons a {
            background: #334155 !important;
            color: #e2e8f0 !important;
            border-color: #475569 !important;
        }
        body.oscuro .pagination-buttons .active-page {
            background: #e2e8f0 !important;
            color: #0f172a !important;
        }
        body.oscuro .btn-tema {
            background: #334155 !important;
            color: #e2e8f0 !important;
            border-color: #475569 !important;
        }
        body.oscuro .btn-salir {
            background: #64748b !important;
        }
    </style>
</head>
<body id="pagina">
<div class="main-container">

    <!-- BARRA SUPERIOR -->
    <div class="barra-usuario">
        <span>
            👤 <strong th:text="${session.usuario}">Usuario</strong>
            <span th:if="${session.rol == 'ADMIN'}"
                  style="background:#f59e0b;color:#1a202c;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;margin-left:6px;">ADMIN</span>
            <span th:if="${session.rol == 'USER'}"
                  style="background:#64748b;color:white;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;margin-left:6px;">USER</span>
        </span>
        <div style="display:flex;gap:8px;align-items:center;">
            <button class="btn-tema" id="btnTema" onclick="cambiarTema()">🌙 Oscuro</button>
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <button type="submit" class="btn-salir">Cerrar sesión</button>
            </form>
        </div>
    </div>

    <!-- ENCABEZADO -->
    <div class="header-container">
        <div class="header-title">
            <h1>Gestor de Eventos</h1>
            <p>Administración y agenda general de eventos programados</p>
        </div>
        <a th:if="${session.rol == 'ADMIN'}" href="/eventos/nuevo" class="btn-nuevo">+ Nuevo evento</a>
    </div>

    <!-- MENSAJE ÉXITO -->
    <div th:if="${mensajeExito}" class="mensaje" th:text="${mensajeExito}"></div>

    <!-- TOOLBAR -->
    <div class="toolbar">
        <div class="categorias-nav">
            <a th:href="@{/eventos}" class="cat-btn"
               th:classappend="${categoriaId == null and (buscar == null or buscar == '')} ? ' active'">
                Todos
            </a>
            <a th:each="cat : ${categorias}"
               th:href="@{/eventos(categoriaId=${cat.id})}"
               th:text="${cat.nombre}"
               class="cat-btn"
               th:classappend="${cat.id == categoriaId} ? ' active'">
            </a>
        </div>
        <form th:action="@{/eventos}" method="get" class="search-container">
            <input type="text" name="buscar" placeholder="Buscar por nombre..." th:value="${buscar}"/>
            <button type="submit">Buscar</button>
            <a th:href="@{/eventos}">Limpiar</a>
        </form>
    </div>

    <!-- TARJETAS -->
    <div class="grid-container">
        <div class="card" th:each="evento : ${eventos}">
            <div>
                <span class="card-badge"
                      th:text="${evento.categoria != null ? evento.categoria.nombre : 'Sin categoría'}">
                </span>
                <h3 th:text="${evento.nombre}">Nombre</h3>
                <p th:text="${evento.descripcion}">Descripción</p>
                <p>📅 <strong>Fecha:</strong>
                    <span style="color:#2563eb;" th:text="${evento.fecha}"></span>
                </p>
                <p>📍 <strong>Lugar:</strong>
                    <span style="color:#2563eb;" th:text="${evento.lugar}"></span>
                </p>
            </div>
            <div class="card-footer" th:if="${session.rol == 'ADMIN'}">
                <a th:href="@{/eventos/editar/{id}(id=${evento.id})}" class="btn-editar">Editar</a>
                <form th:action="@{/eventos/{id}/eliminar(id=${evento.id})}" method="post" style="flex:1;">
                    <button type="submit" class="btn-eliminar"
                            onclick="return confirm('¿Eliminar este evento?')"
                            style="width:100%;">Eliminar</button>
                </form>
            </div>
        </div>
    </div>

    <!-- PAGINACIÓN -->
    <div class="pagination-container" th:if="${totalPages > 0}">
        <span class="pagination-info">
            Página <span th:text="${currentPage + 1}">1</span>
            de <span th:text="${totalPages}">1</span>
        </span>
        <div class="pagination-buttons">
            <a th:href="@{/eventos(page=${currentPage - 1}, buscar=${buscar}, categoriaId=${categoriaId})}"
               th:classappend="${currentPage == 0} ? ' disabled'">Anterior</a>
            <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                <a th:href="@{/eventos(page=${i}, buscar=${buscar}, categoriaId=${categoriaId})}"
                   th:text="${i + 1}"
                   th:classappend="${i == currentPage} ? ' active-page'">1</a>
            </th:block>
            <a th:href="@{/eventos(page=${currentPage + 1}, buscar=${buscar}, categoriaId=${categoriaId})}"
               th:classappend="${currentPage == totalPages - 1} ? ' disabled'">Siguiente</a>
        </div>
    </div>

</div>

<script>
    const pagina = document.getElementById('pagina');
    const btnTema = document.getElementById('btnTema');

    if (localStorage.getItem('tema') === 'oscuro') {
        pagina.classList.add('oscuro');
        btnTema.textContent = '☀️ Claro';
    }

    function cambiarTema() {
        if (pagina.classList.contains('oscuro')) {
            pagina.classList.remove('oscuro');
            localStorage.setItem('tema', 'claro');
            btnTema.textContent = '🌙 Oscuro';
        } else {
            pagina.classList.add('oscuro');
            localStorage.setItem('tema', 'oscuro');
            btnTema.textContent = '☀️ Claro';
        }
    }
</script>
</body>
</html>
